name: Build KisekiKernel

on:
  workflow_dispatch:
    inputs:      
      tag:
        description: 'Release Tag (OneUI7-990)'
        required: true        
        default: 'OneUI7-990'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      
    strategy:
      fail-fast: false
      matrix:
        # Keep exactly the 4 LTE Non-GKI variants for Exynos 990 as requested
        target: [c2slte, c1slte, x1slte, y2slte]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free disk space
        run: |
          echo "::group:: Cleaning up pre-installed software to free space"
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          echo "::endgroup::"

      # Added cleanup for GitHub's broken azure-cli repo so it doesn't cause exit code 100
      - name: Set up build environment
        run: |
          echo "::group:: Installing dependencies and tools"
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list
          
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            curl xxd patchelf flex bison libarchive-tools build-essential pcre2-utils zip \
            llvm lld  # Added this group to fix the '/bin/sh: llvm-ar: not found' error
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "::endgroup::"

      - name: Set up CCache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.target }}-

      - name: Apply KernelSU-Next integration
        run: |
          set -e
          # Clean up any old integration
          if [ -d "drivers/kernelsu" ]; then
            rm -rf drivers/kernelsu
          fi
          
          # Clone the latest KernelSU-Next without hardcoding a dead commit
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git drivers/kernelsu
          
          echo ""
          echo "=== Manually wiring up Kconfig and Makefile ==="
          # Check if already wired to prevent duplicate entries on re-runs
          if ! grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi
          if ! grep -q 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi

          echo ""
          echo "=== KernelSU-Next integrated. Current commit: ==="
          git -C drivers/kernelsu log -1 --oneline 2>/dev/null || echo "(could not read git log)"
      - name: Apply KernelSU-Next manual hooks (official non-GKI patches)
        run: |
          set +e
          mkdir -p /tmp/ksu-hooks
          cd "$GITHUB_WORKSPACE"

          apply_one() {
            local file="$1" patchfile="$2"
            echo ""
            echo "=== Applying manual hook patch to $file ==="
            patch -p1 --fuzz=3 --no-backup-if-mismatch < "$patchfile"
            if [ $? -ne 0 ]; then
              echo "!!! Patch for $file had rejected hunks (see .rej above/below) - printing any .rej:"
              find . -name "$(basename "$file").rej" -newer /tmp/ksu-hooks 2>/dev/null | while read -r rej; do
                echo "--- $rej ---"
                cat "$rej"
              done
            fi
          }

          # --- fs/exec.c: hook do_execveat_common ---
          cat > /tmp/ksu-hooks/exec.patch << 'EOF'
--- a/fs/exec.c
+++ b/fs/exec.c
@@ -1890,11 +1890,14 @@ static int __do_execve_file(int fd, struct filename *filename,
 	return retval;
 }
 
+#ifdef CONFIG_KSU
+extern bool ksu_execveat_hook __read_mostly;
+extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,
+			void *envp, int *flags);
+extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr,
+				 void *argv, void *envp, int *flags);
+#endif
 static int do_execveat_common(int fd, struct filename *filename,
 			      struct user_arg_ptr argv,
 			      struct user_arg_ptr envp,
 			      int flags)
 {
+    #ifdef CONFIG_KSU
+	if (unlikely(ksu_execveat_hook))
+		ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
+	else
+		ksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);
+    #endif
 	return __do_execve_file(fd, filename, argv, envp, flags, NULL);
 }
EOF
          apply_one "fs/exec.c" /tmp/ksu-hooks/exec.patch

          # --- fs/open.c: hook do_faccessat ---
          cat > /tmp/ksu-hooks/open.patch << 'EOF'
--- a/fs/open.c
+++ b/fs/open.c
@@ -348,6 +348,8 @@ SYSCALL_DEFINE4(fallocate, int, fd, int, mode, loff_t, offset, loff_t, len)
 	return ksys_fallocate(fd, mode, offset, len);
 }
 
+#ifdef CONFIG_KSU
+extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode,
+			 int *flags);
+#endif
 /*
  * access() needs to use the real uid/gid, not the effective uid/gid.
  * We do this by temporarily clearing all FS-related capabilities and
@@ -355,6 +357,7 @@ SYSCALL_DEFINE4(fallocate, int, fd, int, mode, loff_t, offset, loff_t, len)
  */
 long do_faccessat(int dfd, const char __user *filename, int mode)
 {
 	const struct cred *old_cred;
 	struct cred *override_cred;
 	struct path path;
 	struct inode *inode;
 	struct vfsmount *mnt;
 	int res;
 	unsigned int lookup_flags = LOOKUP_FOLLOW;
+    #ifdef CONFIG_KSU
+	ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
+    #endif
 
 	if (mode & ~S_IRWXO)	/* where's F_OK, X_OK, W_OK, R_OK? */
 		return -EINVAL;
EOF
          apply_one "fs/open.c" /tmp/ksu-hooks/open.patch

          # --- fs/read_write.c: hook vfs_read ---
          cat > /tmp/ksu-hooks/read_write.patch << 'EOF'
--- a/fs/read_write.c
+++ b/fs/read_write.c
@@ -434,10 +434,14 @@ ssize_t kernel_read(struct file *file, void *buf, size_t count, loff_t *pos)
 }
 EXPORT_SYMBOL(kernel_read);
 
+#ifdef CONFIG_KSU
+extern bool ksu_vfs_read_hook __read_mostly;
+extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr,
+			size_t *count_ptr, loff_t **pos);
+#endif
 ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)
 {
 	ssize_t ret;
+    #ifdef CONFIG_KSU
+	if (unlikely(ksu_vfs_read_hook))
+		ksu_handle_vfs_read(&file, &buf, &count, &pos);
+    #endif
+
 	if (!(file->f_mode & FMODE_READ))
 		return -EBADF;
 	if (!(file->f_mode & FMODE_CAN_READ))
EOF
          apply_one "fs/read_write.c" /tmp/ksu-hooks/read_write.patch

          # --- fs/stat.c: hook vfs_statx ---
          cat > /tmp/ksu-hooks/stat.patch << 'EOF'
--- a/fs/stat.c
+++ b/fs/stat.c
@@ -148,6 +148,8 @@ int vfs_statx_fd(unsigned int fd, struct kstat *stat,
 }
 EXPORT_SYMBOL(vfs_statx_fd);
 
+#ifdef CONFIG_KSU
+extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
+#endif
+
 /**
  * vfs_statx - Get basic and extra attributes by filename
  * @dfd: A file descriptor representing the base dir for a relative filename
@@ -170,6 +172,7 @@ int vfs_statx(int dfd, const char __user *filename, int flags,
 	int error = -EINVAL;
 	unsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;
 
+    #ifdef CONFIG_KSU
+	ksu_handle_stat(&dfd, &filename, &flags);
+    #endif
 	if ((flags & ~(AT_SYMLINK_NOFOLLOW | AT_NO_AUTOMOUNT |
 		       AT_EMPTY_PATH | KSTAT_QUERY_FLAGS)) != 0)
 		return -EINVAL;
EOF
          patch -p1 --fuzz=3 --no-backup-if-mismatch --dry-run < /tmp/ksu-hooks/stat.patch > /dev/null 2>&1
          if [ $? -eq 0 ]; then
            apply_one "fs/stat.c (vfs_statx variant)" /tmp/ksu-hooks/stat.patch
          else
            echo ""
            echo "=== vfs_statx not found in fs/stat.c, falling back to vfs_fstatat variant ==="
            cat > /tmp/ksu-hooks/stat_fstatat.patch << 'EOF'
--- a/fs/stat.c
+++ b/fs/stat.c
@@ -87,6 +87,8 @@ int vfs_fstat(unsigned int fd, struct kstat *stat)
 }
 EXPORT_SYMBOL(vfs_fstat);
 
+#ifdef CONFIG_KSU
+extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
+#endif
 int vfs_fstatat(int dfd, const char __user *filename, struct kstat *stat,
 		int flag)
 {
@@ -94,6 +96,8 @@ int vfs_fstatat(int dfd, const char __user *filename, struct kstat *stat,
 	int error = -EINVAL;
 	unsigned int lookup_flags = 0;
+    #ifdef CONFIG_KSU
+	ksu_handle_stat(&dfd, &filename, &flag);
+    #endif
+
 	if ((flag & ~(AT_SYMLINK_NOFOLLOW | AT_NO_AUTOMOUNT |
 		      AT_EMPTY_PATH)) != 0)
 		goto out;
EOF
            apply_one "fs/stat.c (vfs_fstatat variant)" /tmp/ksu-hooks/stat_fstatat.patch
          fi

          # --- drivers/input/input.c: Safe Mode hook ---
          cat > /tmp/ksu-hooks/input.patch << 'EOF'
--- a/drivers/input/input.c
+++ b/drivers/input/input.c
@@ -367,10 +367,13 @@ static int input_get_disposition(struct input_dev *dev,
 	return disposition;
 }
 
+#ifdef CONFIG_KSU
+extern bool ksu_input_hook __read_mostly;
+extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);
+#endif
+
 static void input_handle_event(struct input_dev *dev,
 			       unsigned int type, unsigned int code, int value)
 {
 	int disposition = input_get_disposition(dev, type, code, &value);
+    #ifdef CONFIG_KSU
+	if (unlikely(ksu_input_hook))
+		ksu_handle_input_handle_event(&type, &code, &value);
+    #endif
 
 	if (disposition != INPUT_IGNORE_EVENT && type != EV_SYN)
 		add_input_randomness(type, code, value);
EOF
          apply_one "drivers/input/input.c" /tmp/ksu-hooks/input.patch

          echo ""
          echo "=== Summary: real diff on the 5 target files after this step ==="
          git diff --stat -- fs/exec.c fs/open.c fs/read_write.c fs/stat.c drivers/input/input.c
          set -e

      - name: Patch SUSFS (KSU Next Support)
        run: |
          set -e

          git clone -b kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu.git susfs

          echo "=== Detected SUSFS_VERSION in this checkout ==="
          grep -R "SUSFS_VERSION" susfs/kernel_patches/include/linux/susfs.h 2>/dev/null || \
            echo "(SUSFS_VERSION string not found - check susfs.h manually if this matters)"

          cp -r susfs/kernel_patches/fs/* fs/
          cp -r susfs/kernel_patches/include/linux/* include/linux/

          set +e
          patch -p1 --fuzz=3 --no-backup-if-mismatch < susfs/kernel_patches/50_add_susfs_in_kernel-4.19.patch
          PATCH_EXIT=$?
          set -e

          echo ""
          echo "=== Any .rej files left behind (rejected hunks) ==="
          find . -name "*.rej" -not -path "./susfs/*" 2>/dev/null | while read -r rej; do
            echo "--- $rej ---"
            cat "$rej"
            echo ""
          done

          if [ "$PATCH_EXIT" -ne 0 ]; then
            echo "!!! WARNING: 50_add_susfs_in_kernel-4.19.patch had rejected hunks (see above)."
          fi

          if [ -d "drivers/kernelsu" ]; then
            echo "=== KernelSU-Next subdirectory listing (2 levels deep) ==="
            find drivers/kernelsu -maxdepth 2 -type d | sort

            echo ""
            echo "=== Files containing 'susfs' (case-insensitive) ==="
            grep -ril susfs drivers/kernelsu 2>/dev/null || echo "(no file containing 'susfs' found)"

            echo ""
            echo "=== Checking for a SUSFS 'spoof version' Kconfig option ==="
            grep -ril "SPOOF" drivers/kernelsu/kernel/Kconfig drivers/kernelsu/Kconfig 2>/dev/null || \
              echo "(no SPOOF-related Kconfig found)"
          fi

      - name: Patch build.sh (fail fast on mkdtimg errors)
        run: |
          set -e
          sed -i \
            -e 's@\(./toolchain/mkdtimg cfg_create build/out/\$MODEL/dtb\.img build/dtconfigs/exynos9830\.cfg -d out/arch/arm64/boot/dts/exynos\)$@\1 || abort@' \
            -e 's@\(./toolchain/mkdtimg cfg_create build/out/\$MODEL/dtbo\.img build/dtconfigs/\$MODEL\.cfg -d out/arch/arm64/boot/dts/samsung\)$@\1 || abort@' \
            build.sh
          echo "=== Verifying the two mkdtimg lines after patching ==="
          grep -n "mkdtimg cfg_create" build.sh

      - name: Run kernel build
        run: |
          chmod +x ./build.sh
          ./build.sh -m ${{ matrix.target }} -k y

      - name: Upload artifact (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeKernel-${{ matrix.target }}-zip
          path: build/out/${{ matrix.target }}/*.zip
          compression-level: 6

  release:
    needs: build 
    runs-on: ubuntu-24.04
    permissions:
      contents: write 
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: raw_artifacts

      - name: Flatten artifacts directory structure
        run: |
          mkdir -p final_artifacts
          if [ -d "raw_artifacts" ]; then
            find raw_artifacts/ -name "*.zip" -exec cp {} final_artifacts/ \;
          fi
          echo "Collected zip files:"
          ls -l final_artifacts/

      - name: Generate Safe Git Tag
        id: git_tag
        run: |
          SAFE_TAG=$(echo "${{ github.event.inputs.tag }}" | sed 's/[\/\\:*?"<>|]/-/g')
          echo "SAFE_TAG=$SAFE_TAG" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.SAFE_TAG }}
          name: "${{ github.event.inputs.tag }}"
          draft: false
          prerelease: false
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "final_artifacts/*.zip"
          body: |
            ## 🚀 Official Release for KisekiKernel 990 (LTE Variants Only)
            
            Automated build generated by GitHub Actions.
            
            - **Commit SHA:** `${{ github.sha }}`
            - **Tag Reference:** `${{ env.SAFE_TAG }}`
            - **Features:** Built-in KernelSU-Next (v3.2.0) + SuSFS (v1.5.5, Non-GKI kernel-4.19)
                        
            #### 🔹 Galaxy S20 Series (LTE)
            | Device Name | Codename | File Name |
            | :--- | :--- | :--- |
            | Galaxy S20 LTE | `x1slte` | `KisekiKernel-x1slte-*.zip` |
            | Galaxy S20+ LTE | `y2slte` | `KisekiKernel-y2slte-*.zip` |
            
            #### 🔹 Galaxy Note 20 Series (LTE)
            | Device Name | Codename | File Name |
            | :--- | :--- | :--- |
            | Galaxy Note 20 LTE | `c1slte` | `KisekiKernel-c1slte-*.zip` |
            | Galaxy Note 20 Ultra LTE | `c2slte` | `KisekiKernel-c2slte-*.zip` |
            
            _Note: Ensure you are on the correct firmware base before flashing._
